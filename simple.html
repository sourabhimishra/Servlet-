<!DOCTYPE html>
<html>
<head>
    <title>Simple Interest Calculator</title>
</head>
<body>

<h2>Simple Interest Calculator</h2>

<form action="interest" method="get">
    Principal Amount:
    <input type="number" step="any" name="principal"><br><br>

    Rate of Interest (%):
    <input type="number" step="any" name="rate"><br><br>

    Time (in years):
    <input type="number" step="any" name="time"><br><br>

    <input type="submit" value="Calculate">
</form>

</body>
</html>
